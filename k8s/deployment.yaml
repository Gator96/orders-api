apiVersion: apps/v1
kind: Deployment

metadata:
  name: orders-api
  namespace: sre-lab

spec:
  replicas: 2

  selector:
    matchLabels:
      app: orders-api

  template:
    metadata:
      labels:
        app: orders-api

    spec:
      containers:
        - name: orders-api
          image: nginx:latest

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: orders-config

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"


